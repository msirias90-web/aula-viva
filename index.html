function makeQ(k,t){
 const L=LIB[k]||LIB.present,f=L.frame(),full=(f.pre+f.ans+f.post).trim(),h=f.always?` (${f.hint})`:"",K=f.ans+f.post;
 if(t==="mc")return{t,k:K,q:f.pre+"___"+f.post+h,opts:shuffle([f.ans,...f.wrong]),a:f.ans};
 if(t==="fill")return{t,k:K,q:f.always?f.pre+"___"+f.post+h:f.pre+"___ ("+f.hint+")"+f.post,a:f.ans};
 if(t==="order"){const c=full.replace(/[.?!]$/,"");let w=shuffle(c.split(" "));if(w.join(" ")===c)w=w.reverse();return{t,k:K,words:w,a:c}}
 if(t==="listen")return{t,k:K,say:full,opts:shuffle([full,...f.wrong.map(w=>(f.pre+w+f.post).trim())]),a:full};
 return{t:"write",q:L.write};
}
const qKey=q=>q.k||q.q||q.a||q.say;
function genQs(k,n,types){
 const auto=types.filter(t=>t!=="write"),out=[],seen=new Set();
 const nAuto=types.includes("write")?n-1:n;
 for(let i=0,tries=0;out.length<nAuto&&tries<200;tries++){
  if(!auto.length)break;const q=makeQ(k,auto[i%auto.length]);
  if(seen.has(qKey(q)))continue;seen.add(qKey(q));out.push(q);i++;
 }
 if(types.includes("write"))out.push(makeQ(k,"write"));
 return out;
}
const isAuto=q=>q.t!=="write";
function correct(q,a){if(!isAuto(q))return null;if(q.t==="mc")return a===q.a;return norm(a)===norm(q.a)}
function aiReview(text,key){
 const t=(text||"").trim();
 if(!t)return{score:0,notes:["No escribió respuesta."],comment:"No encontré tu respuesta escrita. ¡Inténtalo en la próxima práctica!"};
 const notes=[];let err=0;
 const FIX={goed:"went",eated:"ate",buyed:"bought",drinked:"drank",runned:"ran",seed:"saw",haved:"had"};
 t.replace(/\b(goed|eated|buyed|drinked|runned|haved)\b/gi,m=>{notes.push(`“${m}” → “${FIX[m.toLowerCase()]}” (verbo irregular)`);err++});
 const pr=t.match(/\b(brother|sister|mom|dad|mother|father|friend)\s+(he|she)\b/i);
 if(pr){notes.push(`Sobra el pronombre: “${pr[0]}” → “${pr[1]}”`);err++}
 if(key==="present"||key==="food"){
  const skip=/^(is|was|does|doesn't|did|didn't|can|can't|has|had|usually|always|never|often|sometimes|also|really|will|and|the|a|to|he|she|it)$/i;
  t.replace(/\b(he|she|it|brother|sister|mom|dad|mother|father|friend)\s+(?=([a-z]+)\b)/gi,(m,s,v)=>{
   if(skip.test(v)||/s$/i.test(v))return m;
   const fix=/(ch|sh|x|o)$/i.test(v)?v+"es":/[^aeiou]y$/i.test(v)?v.slice(0,-1)+"ies":v+"s";
   notes.push(`“${s} ${v}” → “${s} ${fix}” (con he/she/it el verbo lleva -s)`);err++;return m});
 }
 const sentences=t.split(/[.!?]+/).filter(s=>s.trim().split(/\s+/).length>=3).length;
 if(sentences<2){notes.push("Escribió menos de 2 oraciones completas.");err++}
 const score=Math.max(4,10-err*2);
 const comment=err?`¡Buen trabajo! Repasa esto: ${notes.join("; ")}.`:"¡Excelente! Tus oraciones están muy bien escritas.";
 if(!err)notes.push("Buen uso de la gramática del tema, sin errores.");
 return{score,notes,comment};
}
function gradeOf(p,answers,writeScore){
 let pts=0;p.qs.forEach((q,i)=>{if(isAuto(q))pts+=correct(q,answers[i])?1:0;else pts+=(writeScore??0)/10});
 return Math.round(pts/p.qs.length*100)/10;
}

 const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?(msg||"Copiado"):"No se pudo copiar. Mantén presionado el texto de abajo para copiarlo.")};
 try{navigator.clipboard.writeText(t).then(()=>toast(msg||"Copiado"),fb)}catch(e){fb()}
}
function parseJSON(txt){
 const m=String(txt||"").match(/```(?:json)?\s*([\s\S]*?)```/);let t=m?m[1]:String(txt||"");
 t=t.replace(/[“”]/g,'"');
 const a=t.indexOf("{"),b=t.lastIndexOf("}");
 if(a<0||b<=a)throw new Error("No encontré la respuesta de Claude. Copia todo lo que te respondió y pégalo aquí.");
 try{return JSON.parse(t.slice(a,b+1))}catch(e){throw new Error("La respuesta está incompleta. Pídele a Claude que la repita completa en un solo bloque.")}
}
function convertirPregunta(p){
 const t=p.tipo||p.t,limpia=x=>String(x||"").trim();
 if(t==="mc"){const a=limpia(p.respuesta),q=limpia(p.enunciado);const opts=uniq([a,...(p.opciones||[]).map(limpia)].filter(Boolean)).slice(0,4);
  return a&&q&&opts.length>=2?{t,q,opts:shuffle(opts),a}:null}
 if(t==="fill"){const a=limpia(p.respuesta),q=limpia(p.enunciado);return a&&q&&q.includes("___")?{t,q,a}:null}
 if(t==="order"){const a=limpia(p.oracion||p.respuesta).replace(/[.?!]+$/,"");const w=a.split(/\s+/);if(w.length<3)return null;let words=shuffle(w);if(words.join(" ")===a)words=words.reverse();return{t,words,a}}
 if(t==="listen"){const a=limpia(p.oracion||p.respuesta);const opts=uniq([a,...(p.opciones||[]).map(limpia)].filter(Boolean)).slice(0,4);return a&&opts.length>=2?{t,say:a,opts:shuffle(opts),a}:null}
 if(t==="write"){const q=limpia(p.enunciado);return q?{t,q}:null}
 return null;
}

  vocabulario:(r.vocabulario||[]).map(v=>Array.isArray(v)?v:[v?.en,v?.es]).filter(v=>v[0]&&v[1]).slice(0,16).map(v=>[String(v[0]),String(v[1])]),
  ejemplos:(r.ejemplos||[]).map(String).slice(0,12)};
}
function leerPractica(txt,G){
 const r=parseJSON(txt);let qs=(r.preguntas||[]).map(convertirPregunta).filter(Boolean).filter(q=>G.types.includes(q.t));
 const w=qs.filter(q=>q.t==="write").slice(0,1);qs=[...qs.filter(q=>q.t!=="write"),...w];
 if(!qs.length)throw new Error("No encontré preguntas válidas. Revisa que pegaste toda la respuesta.");
 return qs;
}

function chk(r){if(r.error)throw new Error(traducir(r.error.message||String(r.error)));return r.data}
function traducir(m){
 if(/invalid login credentials/i.test(m))return"Correo o contraseña incorrectos.";
 if(/password should be|weak password/i.test(m))return"La contraseña debe tener al menos 8 caracteres.";
 if(/same.*password|different from the old/i.test(m))return"La contraseña nueva tiene que ser distinta a la actual.";
 if(/email not confirmed/i.test(m))return"Ese correo no está confirmado. Revisa la guía: hay que crear el usuario con Auto Confirm.";
 if(/invalid|expired/i.test(m)&&/token|otp/i.test(m))return"El código no es correcto o ya venció.";
 if(/security purposes|rate limit/i.test(m))return"Espera un minuto antes de pedir otro código.";
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return"No hay conexión. Revisa tu internet.";
 return m;
}
async function fnIA(body){
 const {data,error}=await sb.functions.invoke("ia",{body});
 if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}throw new Error(traducir(m))}
 if(data?.error)throw new Error(data.error);
 return data;
}
async function toJpeg(file,max=1568){
 const img=await createImageBitmap(file);const s=Math.min(1,max/Math.max(img.width,img.height));
 const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
 const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.readAsDataURL(blob)});
 return{blob,b64};
}

function autoScore(s){const p=practice(s.pid);if(!p)return[0,0];const auto=p.qs.filter(isAuto);if(!auto.length)return[0,0];

  return`<button class="card prac" style="width:100%;text-align:left;display:flex" data-act="open" data-id="${s.id}">${avatar(st.name)}
  <div style="flex:1;min-width:0"><b>${esc(st.name)}</b><div class="muted small">${esc(p?.title||"")}</div><div class="small" style="margin-top:3px">${ok}/${tot} automáticas correctas</div></div>

 return`<h1>Revisar</h1><p class="lead">Las entregas llegan aquí. La IA sugiere nota y comentarios; tú decides.</p>

function reviewView(){

 const st=student(s.sid)||{name:"Estudiante"},p=practice(s.pid);
 const wi=p.qs.findIndex(q=>q.t==="write"),ai=s.ai;
 const sug=gradeOf(p,s.answers,ai?.score);
 const [ok,tot]=autoScore(s);

 case"pwd":V.pwd=true;V.draftBrand=undefined;P=null;go();break;
 case"pwdclose":V.pwd=false;V.draftBrand=undefined;go();break;
 case"nologo":V.draftBrand.logo="";render();break;
 case"resend":L.busy=true;render();api.sendCode(L.email).then(()=>toast("Te enviamos otro código"),err=>toast(traducir(err.message))).finally(()=>{L.busy=false;render()});break;
 case"logout":V.pwd=false;run(async()=>{await api.logout();P=null;resetLogin();L.role=S.role||"profesor";V.ci=0;V.newClass=false});break;
 case"reset":try{localStorage.removeItem(DEMO_KEY)}catch(err){}demoSeed();KNOWN=[];lsSet("aula-viva-vocab",[]);P=null;V={...V,t:"materia",s:"inicio",ci:0,review:null,gen:null,photos:[],files:[],reading:-1,newTopic:null,card:0,flip:false,newClass:false};resetLogin();go();toast("Demo reiniciada");break;
 case"cancelnew":V.newClass=false;go();break;
 /* profesor */
 case"read":readPhotos();break;
 case"copytopic":copyText(promptTema(),"Instrucciones copiadas. Ahora ábrelas en Claude con tus fotos");break;
 case"sampletopic":V.mtopic=ejemploTema();render();break;
 case"savetopic":{let r;try{r=leerTema($("#mt").value)}catch(err){toast(err.message);break}
  run(async()=>{const id=await api.saveTopic(r);V.newTopic=id;V.mtopic="";return r.titulo},t=>"Tema “"+t+"” guardado");break}
 case"gmanual":V.gen.manual=true;go();break;
 case"gmanualback":V.gen.manual=false;go();break;
 case"copyprac":copyText(promptPractica(V.gen),"Instrucciones copiadas. Pégalas en Claude");break;
 case"sampleprac":V.gen.paste=ejemploPractica(V.gen);render();break;
 case"parseprac":{const G=V.gen;try{G.preview=leerPractica($("#mp").value,G);G.manual=false;G.paste="";G.title=`Práctica ${cls().practices.length+1} · ${topic(G.topicId).title}`;go()}catch(err){toast(err.message)}break}
 case"copyrev":{const s=S.subs.find(x=>x.id===id),p=practice(s.pid),wi=p.qs.findIndex(q=>q.t==="write");copyText(promptRevision(p.qs[wi],s.answers[wi],p),"Copiado. Pégalo en Claude");break}
 case"clearph":V.photos=[];V.files=[];render();break;
 case"genfrom":if(!cls().topics.length)break;V.t="practicas";V.gen={topicId:id||cls().topics[0].id,types:["mc","fill","order","listen","write"],n:8,level:"Media",invent:true,due:3,preview:null,loading:false,title:"",regen:-1};go();break;
 case"genclose":V.gen=null;go();break;
 case"genback":V.gen.preview=null;go();break;
 case"gtype":{const T=V.gen.types;V.gen.types=T.includes(v)?T.filter(x=>x!==v):[...T,v];render();break}
 case"gn":V.gen.n=+v;render();break;
 case"glevel":V.gen.level=v;render();break;
 case"ginvent":V.gen.invent=!V.gen.invent;render();break;
 case"gdue":V.gen.due=+v;render();break;
 case"generate":generate();break;
 case"qre":{const i=+b.dataset.i,G=V.gen;G.regen=i;render();run(async()=>{const q=await api.regenOne(G,G.preview[i]);if(q)G.preview[i]=q}).then(()=>{G.regen=-1;render()});break}
 case"qdel":V.gen.preview.splice(+b.dataset.i,1);render();break;
 case"assign":{const G=V.gen;run(async()=>{await api.assign(G);V.gen=null;confetti();return cls().students.filter(s=>access(s).on).length},n=>`Práctica asignada · ${n} ${n===1?"estudiante activo":"estudiantes activos"}`);break}
 case"open":openReview(id);break;
 case"retryai":{const s=S.subs.find(x=>x.id===V.review);V.aiLoading=true;render();api.reviewAI(s).catch(err=>toast(traducir(err.message))).finally(()=>{V.aiLoading=false;render()});break}
 case"closerev":V.review=null;go();break;
 case"approve":{const s=S.subs.find(x=>x.id===id);const c=$("#cm").value.trim(),raw=$("#gr").value;
  if(raw===""){toast("Escribe la nota");$("#gr").focus();break}
  const g=Math.max(0,Math.min(10,Math.round(parseFloat(raw)*2)/2||0));
  const nm=(student(s.sid)?.name||"").split(" ")[0];
  run(async()=>{await api.approve(s,g,c);V.review=null},"Enviado a "+nm);break}
 case"enable":setUntil(id,now()+(+v)*DAY);break;
 case"disable":setUntil(id,null);break;
 case"copy":{const code=cls().code;try{navigator.clipboard.writeText(code).then(()=>toast("Código copiado"),()=>toast("Código: "+code))}catch(err){toast("Código: "+code)}break}
 /* estudiante */
 case"start":startPractice(id);break;
 case"say":speak(v);break;
 case"sayslow":speak(v,.55);break;
 case"flip":V.flip=!V.flip;render();break;
 case"vnext":{const vs=allVocab(),w=vs[V.card%vs.length][0];if(v==="1"&&!KNOWN.includes(w)){KNOWN.push(w);lsSet("aula-viva-vocab",KNOWN)}V.card++;V.flip=false;render();break}
 case"quit":P=null;go();break;
 case"sel":P.sel=+v;render();break;
 case"pickw":P.picked.push(+v);render();break;
 case"unpick":P.picked.splice(+v,1);render();break;
 case"check":doCheck();break;
 case"savew":{const q=practice(P.pid).qs[P.i];P.answers[P.i]=curAnswer(q);nextQ();break}
 case"next":nextQ();break;
 case"finish":P=null;V.s="inicio";go();break;
 }
});
document.addEventListener("input",e=>{
 const k=e.target.dataset.in;if(!k)return;const val=e.target.value;
 if(k==="ptext"){P.text=val;const cb=$("#checkBtn");if(cb)cb.disabled=!hasAnswer()}
 if(k==="gtitle")V.gen.title=val;
 if(k==="mtopic")V.mtopic=val;
 if(k==="appname")V.draftBrand.name=val;
 if(k==="mprac")V.gen.paste=val;
 if(k==="draft")V.draft=val;
 if(k==="dgrade")V.dgrade=val;
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.in==="gtopic"){V.gen.topicId=t.value;return}
 if(t.dataset.in==="clase"){if(t.value==="new"){V.newClass=true}else{V.ci=+t.value;V.newClass=false;V.review=null;V.gen=null;V.card=0}P=null;go();return}
 if(t.dataset.date&&t.value){const d=new Date(t.value+"T23:59:00");setUntil(t.dataset.date,d.getTime());return}
 if(t.hasAttribute("data-logo")&&t.files.length){logoFromFile(t.files[0]).then(u=>{V.draftBrand.logo=u;render()},()=>toast("No pude leer esa imagen"));return}
 if(t.hasAttribute("data-file")&&t.files.length){for(const f of t.files){V.files.push(f);V.photos.push(URL.createObjectURL(f))}V.newTopic=null;render()}
});
document.addEventListener("keydown",e=>{
 if(!P||P.done)return;
 if(e.key==="Enter"&&!P.checked&&e.target.id==="ans"&&e.target.tagName==="INPUT"&&hasAnswer()){e.preventDefault();doCheck()}
 else if(e.key==="Enter"&&P.checked&&e.target.tagName!=="TEXTAREA"){e.preventDefault();nextQ()}
});
document.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target.dataset.form;
 if(f==="email"){const em=$("#em").value.trim().toLowerCase();if(!EMAIL.test(em)){L.err="Escribe un correo válido.";render();return}
  L.email=em;L.err="";L.busy=true;render();
  try{const t=await api.loginType(em);
   if(t==="contrasena"){L.role="profesor";L.step="pass"}
   else{L.role="estudiante";await api.sendCode(em);L.step=2}}
  catch(err){L.err=traducir(err.message)}
  L.busy=false;render();setTimeout(()=>($("#cd")||$("#pw"))?.focus(),50)}
 if(f==="pass"){const pw=$("#pw").value;if(!pw){L.err="Escribe tu contraseña.";render();return}
  L.err="";L.busy=true;render();
  try{const r=await api.signInPassword(L.email,pw);if(r.hasProfile){resetLogin();V.ci=0;go();return}L.step=3}catch(err){L.err=traducir(err.message)}
  L.busy=false;render()}
 if(f==="pwd"){const a=$("#np").value,b=$("#np2").value;if(a.length<8){toast("Usa al menos 8 caracteres");return}if(a!==b){toast("Las contraseñas no coinciden");return}
  run(async()=>{await api.changePassword(a)},"Contraseña cambiada")}
 if(f==="brand"){const n=$("#an").value.trim();if(n.length<2){toast("Escribe el nombre de la app");return}
  const b={name:n,logo:V.draftBrand.logo||""};run(async()=>{await api.saveBrand(b);V.draftBrand={...BRAND}},"App actualizada")}
 if(f==="myname"){const n=$("#mn").value.trim();if(n.length<2){toast("Escribe tu nombre");return}run(()=>api.saveName(n),"Nombre guardado")}
 if(f==="code"){const c=$("#cd").value.replace(/\D/g,"");if(c.length<6){L.err="Escribe el código completo.";render();return}
  L.err="";L.busy=true;render();
  try{const r=await api.verify(L.email,c);if(r.hasProfile){resetLogin();V.ci=0;go();return}L.step=3}catch(err){L.err=traducir(err.message)}
  L.busy=false;render()}
 if(f==="profile"){const nm=$("#nm").value.trim();L.name=nm;if(nm.length<2){L.err="Escribe tu nombre.";render();return}
  const code=L.role==="estudiante"?($("#cc").value||"").trim().toUpperCase():"";L.code=code;
  L.err="";L.busy=true;render();
  try{await api.createProfile({role:L.role,name:nm,email:L.email||S.email,code});resetLogin();V.ci=0;go();toast("¡Bienvenido, "+nm.split(" ")[0]+"!")}
  catch(err){const m=traducir(err.message);L.busy=false;
   if(S.user){resetLogin();go();toast(m)}
   else if(!DEMO&&/ya no existe/.test(m)){const em=L.email;resetLogin();L.email=em;L.err=m;render()}
   else{L.err=m;render()}}}
 if(f==="newclass"){const n=$("#cn").value.trim(),s=$("#cs").value.trim();if(n.length<2){toast("Escribe el nombre de la clase");return}
  run(async()=>{const i=await api.createClass(n,s);V.ci=i<0?0:i;V.newClass=false;V.t="alumnos";lsSet("aula-viva-ci",V.ci)},"Clase creada. Comparte el código con tus estudiantes")}
 if(f==="join"){const c=$("#jc").value.trim().toUpperCase();if(c.length<4){toast("Escribe el código de la clase");return}
  run(async()=>{const i=await api.joinClass(c);V.ci=i<0?0:i;V.newClass=false;V.s="inicio";lsSet("aula-viva-ci",V.ci)},"Te uniste a la clase. Tu profesor debe habilitar tu acceso")}
});

/* ============ arranque ============ */
async function boot(){
 V.loading=true;V.offline=false;applyBrand();render();
 try{
  try{await api.loadBrand()}catch(e){}
  if(!DEMO&&!sb)throw new Error("No se pudo cargar Supabase");
  await api.init();
  if(!DEMO&&S.needProfile){L.step=3;L.email=S.email;try{L.role=(await api.loginType(S.email))==="contrasena"?"profesor":"estudiante"}catch(e){L.role="estudiante"}}
  if(!DEMO)sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"&&S.user){S.user=null;render()}});
 }catch(e){console.error(e);if(!DEMO){V.loading=false;V.offline=true;render();return}}
 V.loading=false;render();
}
boot();
</script>
</body>
</html>
